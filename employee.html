<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Attendance</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0f172a18;text-align:center}
.logo{font-size:42px}h2{margin:8px 0;color:#172554}.muted{color:#64748b;font-size:14px}
video{width:100%;max-height:300px;object-fit:cover;background:#111;border-radius:14px;margin-top:18px;display:none}
button{width:100%;padding:15px;border:0;border-radius:11px;background:#2563eb;color:white;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer}
button:disabled{opacity:.55}#punch{background:#15803d;display:none}#again{background:#475569;display:none}
#employee{display:none;padding:12px;background:#f8fafc;border-radius:12px;margin-top:14px}
#message{white-space:pre-line;background:#f1f5f9;padding:12px;border-radius:10px;margin-top:16px;color:#334155;font-size:14px}
</style>
</head>
<body>
<main class="card">
 <div class="logo">👤</div><h2>Company Attendance</h2>
 <p class="muted">Face Recognition Attendance</p>
 <video id="video" autoplay muted playsinline></video>
 <button id="start">Start Face Scan</button>
 <button id="identify" hidden>Identify My Face</button>
 <section id="employee"><b id="empName"></b><p id="empId"></p></section>
 <button id="punch">PUNCH IN</button>
 <button id="again">Scan Again</button>
 <div id="message">Press Start Face Scan.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyAtQDdI2P9MgeTAEWKpdEgsS6KCNO1fXnw",
 authDomain:"company-attendance-8bbb1.firebaseapp.com",
 databaseURL:"https://company-attendance-8bbb1-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"company-attendance-8bbb1",
 storageBucket:"company-attendance-8bbb1.firebasestorage.app",
 messagingSenderId:"528681450890",
 appId:"1:528681450890:web:65c943b5b8e72557de5c73",
 measurementId:"G-KYSG7CD4W3"
};
const WORKER="https://morning-boat-14f9.pratikprabhakar200.workers.dev";
const MODEL="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model/";
const app=initializeApp(firebaseConfig),auth=getAuth(app);
const $=id=>document.getElementById(id);
let stream=null,descriptor=null,employee=null,punchedIn=false,modelsReady=false;

function say(t){$("message").textContent=t}
async function token(){
 if(!auth.currentUser) await signInAnonymously(auth);
 return auth.currentUser.getIdToken(true);
}
async function callApi(path,payload){
 const t=await token();
 const r=await fetch(WORKER+path,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+t},body:JSON.stringify(payload)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(d.error||d.message||`Server error ${r.status}`);
 return d;
}
async function loadModels(){
 if(modelsReady)return;
 await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);
 await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL);
 await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL);
 modelsReady=true;
}
$("start").onclick=async()=>{
 try{
  $("start").disabled=true;say("Loading face model and camera...");
  await signInAnonymously(auth);
  await loadModels();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  $("video").srcObject=stream;$("video").style.display="block";
  $("start").hidden=true;$("identify").hidden=false;say("Camera ready. Look straight at the camera.");
 }catch(e){say("Error: "+e.message);$("start").disabled=false}
};
$("identify").onclick=async()=>{
 try{
  $("identify").disabled=true;say("Scanning face...");
  const result=await faceapi.detectSingleFace($("video"),new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  if(!result)throw new Error("Face not detected. Move to good light and look at camera.");
  descriptor=Array.from(result.descriptor);
  const d=await callApi("/face-identify",{descriptor});
  if(!d.success||!d.employee)throw new Error(d.error||"Face not recognized. Contact admin.");
  employee=d.employee;punchedIn=!!d.currentlyPunchedIn;
  $("empName").textContent=employee.name||"Employee";
  $("empId").textContent="Employee ID: "+(employee.employeeId||"");
  $("employee").style.display="block";$("identify").hidden=true;
  $("punch").style.display="block";$("punch").textContent=punchedIn?"PUNCH OUT":"PUNCH IN";
  $("again").style.display="block";say("Face identified successfully.");
 }catch(e){say("Error: "+e.message);$("identify").disabled=false}
};
function gps(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject(new Error("GPS is not available."));
  navigator.geolocation.getCurrentPosition(p=>{
   if(p.coords.accuracy>100)return reject(new Error("GPS accuracy is weak. Try outdoors."));
   resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy});
  },e=>reject(new Error("GPS: "+e.message)),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });
}
$("punch").onclick=async()=>{
 try{
  $("punch").disabled=true;const action=punchedIn?"OUT":"IN";
  say("Checking GPS...");const location=await gps();
  say("Saving attendance...");
  const d=await callApi("/face-punch",{action,descriptor,...location});
  if(!d.success)throw new Error(d.error||"Punch failed.");
  punchedIn=action==="IN";$("punch").textContent=punchedIn?"PUNCH OUT":"PUNCH IN";
  let msg=action==="IN"?"Punch IN successful":"Punch OUT successful";
  if(d.time)msg+="\nTime: "+d.time;
  if(d.workHours!==undefined)msg+="\nWork Hours: "+d.workHours;
  if(d.otHours!==undefined)msg+="\nOT Hours: "+d.otHours;
  say(msg);
 }catch(e){say("Error: "+e.message)}finally{$("punch").disabled=false}
};
$("again").onclick=()=>{
 if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;descriptor=null;employee=null;punchedIn=false;
 $("video").srcObject=null;$("video").style.display="none";$("employee").style.display="none";
 $("punch").style.display="none";$("again").style.display="none";$("start").hidden=false;$("start").disabled=false;
 $("identify").hidden=true;$("identify").disabled=false;say("Press Start Face Scan.");
};
</script>
</body>
</html>
