
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Attendance</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f5f9;color:#172554;padding:16px}
.container{max-width:430px;margin:35px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 5px 25px #0001;text-align:center}
h2{margin-bottom:5px}
p{color:#64748b}
button{width:100%;padding:15px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px;margin:8px 0;cursor:pointer}
button:disabled{opacity:.5}
.green{background:#16a34a}
.red{background:#dc2626}
.hidden{display:none!important}
video{width:100%;border-radius:12px;background:#111;margin:12px 0}
#message{margin-top:15px;overflow-wrap:anywhere;font-size:14px}
.small{font-size:12px}
</style>
</head>

<body>
<div class="container">

<h2>COMPANY ATTENDANCE</h2>
<p>EMPLOYEE FACE PUNCH SYSTEM</p>

<div id="startSection">
<button id="startBtn">START FACE SCAN</button>
</div>

<div id="cameraSection" class="hidden">
<video id="video" autoplay muted playsinline></video>
<p id="scanStatus">Camera start ho raha hai...</p>
<button id="captureBtn" class="green" disabled>RECOGNIZE FACE</button>
</div>

<div id="punchSection" class="hidden">
<p id="employeeInfo"></p>
<button id="punchIn" class="green">PUNCH IN</button>
<button id="punchOut" class="red hidden">PUNCH OUT</button>
</div>

<div id="message"></div>

<p class="small">
Face verification aur company ki 50 metre GPS boundary zaroori hai.
</p>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import * as faceapi from
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.esm.js";

const firebaseConfig = {
 apiKey: "AIzaSyCf8VATHo9dmDav73IX1i_WiWuBprrj7Zg",
 authDomain: "company-attendance-8bbb1.firebaseapp.com",
 databaseURL: "https://company-attendance-8bbb1-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "company-attendance-8bbb1",
 storageBucket: "company-attendance-8bbb1.firebasestorage.app",
 messagingSenderId: "528681450890",
 appId: "1:528681450890:web:fa49fe969b9c23f2de5c73"
};

const WORKER_URL =
"https://morning-boat-14f9.pratikprabhakar200.workers.dev";

const MODEL_URL =
"https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model/";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let cameraStream = null;
let modelsReady = false;
let recognizedEmployee = null;
let currentAction = "IN";

function message(text,color="#dc2626"){
 $("message").style.color=color;
 $("message").textContent=text;
}

async function loadModels(){
 if(modelsReady) return;

 message("Face recognition models load ho rahe hain...","#2563eb");

 await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
 await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
 await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

 modelsReady=true;
}

async function getAnonymousToken(){
 if(!auth.currentUser){
   await signInAnonymously(auth);
 }
 return await auth.currentUser.getIdToken(true);
}

async function startCamera(){
 try{
   $("startBtn").disabled=true;
   message("Camera aur face system start ho raha hai...","#2563eb");

   await loadModels();
   await getAnonymousToken();

   cameraStream=await navigator.mediaDevices.getUserMedia({
     video:{facingMode:"user"},
     audio:false
   });

   $("video").srcObject=cameraStream;

   $("startSection").classList.add("hidden");
   $("cameraSection").classList.remove("hidden");

   $("scanStatus").textContent="Camera ready. Seedha camera ki taraf dekhein.";
   message("Camera ready","#16a34a");

 }catch(error){
   message("Start error: "+error.message);
   $("startBtn").disabled=false;
 }
}

$("video").addEventListener("playing",()=>{
 $("captureBtn").disabled=false;
});

async function recognizeFace(){
 try{
   $("captureBtn").disabled=true;
   message("Aapka face verify ho raha hai...","#2563eb");

   const result=await faceapi
     .detectSingleFace(
       $("video"),
       new faceapi.TinyFaceDetectorOptions()
     )
     .withFaceLandmarks()
     .withFaceDescriptor();

   if(!result){
     throw new Error("Face detect nahi hua. Dobara try karein.");
   }

   const descriptor=Array.from(result.descriptor);

   const position=await getGPS();
   const token=await getAnonymousToken();

   const response=await fetch(WORKER_URL+"/face-punch",{
     method:"POST",
     headers:{
       "Content-Type":"application/json",
       "Authorization":"Bearer "+token
     },
     body:JSON.stringify({
       descriptor,
       action:"IN",
       latitude:position.coords.latitude,
       longitude:position.coords.longitude
     })
   });

   const data=await response.json();

   if(!response.ok||!data.success){
     throw new Error(data.message||"Face verification failed");
   }

   recognizedEmployee=data;

   $("cameraSection").classList.add("hidden");
   $("punchSection").classList.remove("hidden");

   $("employeeInfo").textContent=
     "Employee: "+data.employeeName+
     " | ID: "+data.employeeId;

   $("punchIn").classList.remove("hidden");
   $("punchOut").classList.add("hidden");

   message("Face recognized successfully. Ab Punch IN karein.","#16a34a");

 }catch(error){
   message(error.message);
   $("captureBtn").disabled=false;
 }
}

function getGPS(){
 return new Promise((resolve,reject)=>{
   if(!navigator.geolocation){
     reject(new Error("GPS is not supported"));
     return;
   }

   navigator.geolocation.getCurrentPosition(
     resolve,
     error=>reject(new Error("GPS error: "+error.message)),
     {
       enableHighAccuracy:true,
       timeout:20000,
       maximumAge:0
     }
   );
 });
}

async function punch(action){
 try{
   $("punchIn").disabled=true;
   $("punchOut").disabled=true;

   message("GPS location check ho rahi hai...","#2563eb");

   const position=await getGPS();
   const token=await getAnonymousToken();

   const response=await fetch(WORKER_URL+"/face-punch",{
     method:"POST",
     headers:{
       "Content-Type":"application/json",
       "Authorization":"Bearer "+token
     },
     body:JSON.stringify({
       descriptor:recognizedEmployee.descriptor,
       action,
       latitude:position.coords.latitude,
       longitude:position.coords.longitude
     })
   });

   const data=await response.json();

   if(!response.ok||!data.success){
     throw new Error(data.message||"Punch failed");
   }

   message(
     data.message+
     " | "+data.date+
     " | "+data.time+
     " | GPS "+data.distanceMeters+" metres",
     "#16a34a"
   );

   if(action==="IN"){
     $("punchIn").classList.add("hidden");
     $("punchOut").classList.remove("hidden");
   }else{
     $("punchOut").classList.add("hidden");
     $("punchIn").classList.remove("hidden");
   }

 }catch(error){
   message(error.message);
 }finally{
   $("punchIn").disabled=false;
   $("punchOut").disabled=false;
 }
}

$("startBtn").onclick=startCamera;
$("captureBtn").onclick=recognizeFace;
$("punchIn").onclick=()=>punch("IN");
$("punchOut").onclick=()=>punch("OUT");

</script>
</body>
</html>
