
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Attendance</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.logo {
  font-size: 42px;
  margin-bottom: 8px;
}

h2 {
  margin: 5px 0;
  color: #172554;
}

.subtitle {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 20px;
}

.camera-box {
  width: 100%;
  height: 290px;
  background: #111827;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.camera-placeholder {
  position: absolute;
  color: white;
  font-size: 14px;
  padding: 15px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 13px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.scan-btn {
  background: #2563eb;
  color: white;
}

.in-btn {
  background: #16a34a;
  color: white;
}

.out-btn {
  background: #dc2626;
  color: white;
}

.reset-btn {
  background: #e2e8f0;
  color: #334155;
}

.employee-card {
  display: none;
  background: #eff6ff;
  padding: 16px;
  border-radius: 12px;
  margin-top: 18px;
  text-align: left;
}

.employee-card p {
  margin: 7px 0;
  color: #334155;
}

.status {
  margin-top: 15px;
  font-size: 14px;
  color: #475569;
  min-height: 22px;
  line-height: 1.5;
}

.success {
  color: #15803d;
  font-weight: bold;
}

.error {
  color: #dc2626;
  font-weight: bold;
}

.hidden {
  display: none !important;
}

.footer {
  margin-top: 20px;
  font-size: 11px;
  color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">👤</div>

  <h2>Company Attendance</h2>

  <div class="subtitle">
    Face Recognition Attendance System
  </div>

  <div class="camera-box">
    <video id="video" autoplay muted playsinline></video>
    <div class="camera-placeholder" id="cameraPlaceholder">
      Camera will appear here
    </div>
  </div>

  <button class="scan-btn" id="startBtn">
    Start Face Scan
  </button>

  <button class="scan-btn hidden" id="scanBtn">
    Identify My Face
  </button>

  <div class="employee-card" id="employeeCard">
    <p><b>Employee Name:</b> <span id="employeeName">-</span></p>
    <p><b>Employee ID:</b> <span id="employeeId">-</span></p>
    <p><b>Attendance:</b> <span id="attendanceState">-</span></p>
  </div>

  <button class="in-btn hidden" id="inBtn">
    PUNCH IN
  </button>

  <button class="out-btn hidden" id="outBtn">
    PUNCH OUT
  </button>

  <button class="reset-btn hidden" id="resetBtn">
    Scan Again
  </button>

  <div class="status" id="status">
    Please start the camera.
  </div>

  <div class="footer">
    Secure Attendance • Face Recognition • GPS Verification
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ======================================
// FIREBASE CONFIG
// ======================================

const firebaseConfig = {
  apiKey: "AIzaSyCf8VATHo9dmDav73IX1i_WiWuBprrj7Zg",
  authDomain: "company-attendance-8bbb1.firebaseapp.com",
  databaseURL: "https://company-attendance-8bbb1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "company-attendance-8bbb1",
  storageBucket: "company-attendance-8bbb1.firebasestorage.app",
  messagingSenderId: "528681450890",
  appId: "1:528681450890:web:fa49fe969b9c23f2de5c73",
  measurementId: "G-BHG5DXXTFF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ======================================
// WORKER URL
// ======================================

const WORKER_URL =
  "https://morning-boat-14f9.pratikprabhakar200.workers.dev";

// ======================================
// ELEMENTS
// ======================================

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const scanBtn = document.getElementById("scanBtn");
const inBtn = document.getElementById("inBtn");
const outBtn = document.getElementById("outBtn");
const resetBtn = document.getElementById("resetBtn");

const statusBox = document.getElementById("status");
const employeeCard = document.getElementById("employeeCard");
const cameraPlaceholder =
  document.getElementById("cameraPlaceholder");

// ======================================
// VARIABLES
// ======================================

let cameraStream = null;
let modelsLoaded = false;
let recognizedEmployee = null;
let faceApiReady = false;

// Descriptor is kept only in page memory.
// It is not stored in localStorage or Firebase.

// ======================================
// STATUS MESSAGE
// ======================================

function showStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

// ======================================
// FIREBASE ANONYMOUS LOGIN
// ======================================

async function getAnonymousToken() {
  let user = auth.currentUser;

  if (!user) {
    const result = await signInAnonymously(auth);
    user = result.user;
  }

  return await user.getIdToken(true);
}

// ======================================
// LOAD FACE MODELS
// ======================================

async function loadModels() {
  if (modelsLoaded) return;

  showStatus("Loading face recognition models...");

  const MODEL_URL =
    "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model/";

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

  modelsLoaded = true;
}

// ======================================
// START CAMERA
// ======================================

startBtn.addEventListener("click", async () => {
  try {
    startBtn.disabled = true;
    showStatus("Starting camera...");

    await getAnonymousToken();
    await loadModels();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = cameraStream;

    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    await video.play();

    cameraPlaceholder.classList.add("hidden");
    startBtn.classList.add("hidden");
    scanBtn.classList.remove("hidden");

    showStatus("Camera ready. Look at the camera.");

  } catch (error) {
    console.error(error);
    startBtn.disabled = false;
    showStatus(
      "Camera or login error: " + error.message,
      "error"
    );
  }
});

// ======================================
// GET FACE DESCRIPTOR
// ======================================

async function captureFaceDescriptor() {
  const detection = await faceapi
    .detectSingleFace(
      video,
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 416,
        scoreThreshold: 0.5
      })
    )
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    throw new Error(
      "Face not detected. Look directly at the camera."
    );
  }

  return Array.from(detection.descriptor);
}

// ======================================
// API REQUEST
// ======================================

async function workerRequest(route, data) {
  const token = await getAnonymousToken();

  const response = await fetch(
    WORKER_URL + route,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify(data)
    }
  );

  const result = await response.json();

  if (!response.ok || !result.success) {
    throw new Error(
      result.message || "Server request failed"
    );
  }

  return result;
}

// ======================================
// IDENTIFY FACE
// ======================================

scanBtn.addEventListener("click", async () => {
  try {
    scanBtn.disabled = true;
    showStatus("Scanning face...");

    const descriptor = await captureFaceDescriptor();

    showStatus("Checking employee identity...");

    // IMPORTANT:
    // This endpoint identifies the employee only.
    // It does NOT create attendance.

    const result = await workerRequest(
      "/face-identify",
      { descriptor }
    );

    recognizedEmployee = {
      employeeId: result.employeeId,
      employeeName: result.employeeName,
      descriptor: descriptor
    };

    document.getElementById("employeeName").textContent =
      result.employeeName;

    document.getElementById("employeeId").textContent =
      result.employeeId;

    employeeCard.style.display = "block";

    if (result.currentlyPunchedIn) {
      document.getElementById("attendanceState").textContent =
        "Already Punched IN";

      inBtn.classList.add("hidden");
      outBtn.classList.remove("hidden");

    } else {
      document.getElementById("attendanceState").textContent =
        "Not Punched IN";

      outBtn.classList.add("hidden");
      inBtn.classList.remove("hidden");
    }

    scanBtn.classList.add("hidden");
    resetBtn.classList.remove("hidden");

    showStatus(
      "Face identified successfully. Please select your attendance action.",
      "success"
    );

  } catch (error) {
    console.error(error);
    recognizedEmployee = null;
    showStatus(error.message, "error");
  } finally {
    scanBtn.disabled = false;
  }
});

// ======================================
// GET GPS LOCATION
// ======================================

function getGPS() {
  return new Promise((resolve, reject) => {

    if (!navigator.geolocation) {
      reject(new Error("GPS is not supported by this device."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => {
        resolve({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        });
      },
      error => {
        reject(
          new Error(
            "GPS permission required. Please allow location."
          )
        );
      },
      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );

  });
}

// ======================================
// PUNCH IN / OUT
// ======================================

async function punchAttendance(action) {

  if (!recognizedEmployee) {
    showStatus("Please scan your face first.", "error");
    return;
  }

  const button = action === "IN" ? inBtn : outBtn;

  try {
    button.disabled = true;
    showStatus("Checking GPS location...");

    const gps = await getGPS();

    showStatus("Verifying company location...");

    const result = await workerRequest(
      "/face-punch",
      {
        descriptor: recognizedEmployee.descriptor,
        action: action,
        latitude: gps.latitude,
        longitude: gps.longitude
      }
    );

    document.getElementById("attendanceState").textContent =
      action === "IN" ? "Punched IN" : "Punched OUT";

    showStatus(
      `Punch ${action} successful! Time: ${result.time}. Distance: ${result.distanceMeters} metres.`,
      "success"
    );

    if (action === "IN") {
      inBtn.classList.add("hidden");
      outBtn.classList.remove("hidden");
    } else {
      outBtn.classList.add("hidden");
      inBtn.classList.remove("hidden");
    }

  } catch (error) {
    console.error(error);
    showStatus(error.message, "error");
  } finally {
    button.disabled = false;
  }
}

inBtn.addEventListener("click", () => {
  punchAttendance("IN");
});

outBtn.addEventListener("click", () => {
  punchAttendance("OUT");
});

// ======================================
// RESET / SCAN AGAIN
// ======================================

resetBtn.addEventListener("click", () => {

  recognizedEmployee = null;

  employeeCard.style.display = "none";

  inBtn.classList.add("hidden");
  outBtn.classList.add("hidden");

  resetBtn.classList.add("hidden");
  scanBtn.classList.remove("hidden");

  showStatus("Please scan your face again.");

});

// ======================================
// INITIAL CHECK
// ======================================

if (
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
) {
  showStatus(
    "Camera requires HTTPS and browser permission.",
    "error"
  );
}

</script>

</body>
</html>
