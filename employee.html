<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Attendance</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf2f7;
  font-family:Arial,sans-serif;
  color:#172033;
}
.container{
  width:92%;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 30px #00000012;
  text-align:center;
}
.logo{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#e0efff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  font-size:30px;
}
h2{margin:8px 0}
#camera{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  background:#111;
  margin-top:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  background:#1769aa;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.green{background:#15803d}
.red{background:#dc2626}
.hidden{display:none!important}
#message{
  margin-top:15px;
  line-height:1.5;
  font-size:14px;
}
.employee{
  background:#eff6ff;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
  text-align:left;
  line-height:1.8;
}
.small{font-size:12px;color:#64748b}
</style>
</head>

<body>

<div class="container">

<div class="logo">👤</div>
<h2>Company Attendance</h2>
<p class="small">Face Recognition Attendance System</p>

<video id="camera" autoplay muted playsinline class="hidden"></video>

<button id="scanButton" onclick="startScan()">
  Start Face Scan
</button>

<button id="identifyButton" onclick="identifyFace()" class="hidden">
  Identify My Face
</button>

<div id="employeeBox" class="employee hidden">
  <b>Employee Name:</b>
  <span id="employeeName"></span><br>

  <b>Employee ID:</b>
  <span id="employeeId"></span><br>

  <b>Attendance:</b>
  <span id="attendanceState"></span>
</div>

<button id="punchButton" class="hidden" onclick="punchAttendance()">
  Punch IN
</button>

<button id="rescanButton" class="red hidden" onclick="resetScan()">
  Rescan Face
</button>

<div id="message"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCf8VATHo9dmDav73IX1i_WWuBprrj7Zg",
  authDomain: "company-attendance-8bbb1.firebaseapp.com",
  databaseURL: "https://company-attendance-8bbb1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "company-attendance-8bbb1",
  storageBucket: "company-attendance-8bbb1.firebasestorage.app",
  messagingSenderId: "528681450890",
  appId: "1:528681450890:web:fa49fe969b9c23f2de5c73",
  measurementId: "G-BHG5DXXTFF"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const WORKER_URL =
"https://morning-boat-14f9.pratikprabhakar200.workers.dev";

let cameraStream = null;
let faceModelsLoaded = false;
let currentEmployee = null;
let currentDescriptor = null;
let busy = false;

const camera = document.getElementById("camera");

function message(text,color="#334155"){
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.color = color;
}

function show(id){
  document.getElementById(id).classList.remove("hidden");
}

function hide(id){
  document.getElementById(id).classList.add("hidden");
}

async function ensureLogin(){
  if(auth.currentUser) return auth.currentUser;

  const result = await auth.signInAnonymously();
  return result.user;
}

async function loadFaceModels(){
  if(faceModelsLoaded) return;

  if(!window.faceapi){
    await new Promise((resolve,reject)=>{
      const script = document.createElement("script");
      script.src =
      "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js";
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  const modelUrl =
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model/";

  await faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl);
  await faceapi.nets.faceLandmark68Net.loadFromUri(modelUrl);
  await faceapi.nets.faceRecognitionNet.loadFromUri(modelUrl);

  faceModelsLoaded = true;
}

async function startScan(){
  if(busy) return;
  busy = true;

  try{
    message("Camera शुरू हो रहा है...");

    await ensureLogin();
    await loadFaceModels();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:640,
        height:480
      },
      audio:false
    });

    camera.srcObject = cameraStream;

    show("camera");
    hide("scanButton");
    show("identifyButton");

    message("Camera तैयार है। अब Identify My Face दबाएं।","#15803d");

  }catch(error){
    message("Error: "+error.message,"#dc2626");
  }finally{
    busy = false;
  }
}

async function identifyFace(){
  if(busy) return;
  busy = true;

  try{
    if(!cameraStream || camera.readyState < 2){
      throw new Error("पहले Camera शुरू करें");
    }

    message("Face पहचान रहे हैं...");

    const result = await faceapi
      .detectSingleFace(
        camera,
        new faceapi.TinyFaceDetectorOptions()
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

    if(!result){
      throw new Error("Face नहीं मिला। Camera के सामने सीधे देखें।");
    }

    currentDescriptor = Array.from(result.descriptor);

    const user = await ensureLogin();
    const token = await user.getIdToken(true);

    const response = await fetch(
      WORKER_URL+"/face-identify",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
          descriptor:currentDescriptor
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.message || "Face पहचान नहीं हुई");
    }

    currentEmployee = {
      employeeId:data.employeeId,
      employeeName:data.employeeName,
      currentlyPunchedIn:data.currentlyPunchedIn
    };

    document.getElementById("employeeName").textContent =
      currentEmployee.employeeName;

    document.getElementById("employeeId").textContent =
      currentEmployee.employeeId;

    updatePunchButton();

    show("employeeBox");
    show("punchButton");
    show("rescanButton");
    hide("identifyButton");

    message("Face पहचान सफल हुई।","#15803d");

  }catch(error){
    currentDescriptor = null;
    currentEmployee = null;
    message(error.message,"#dc2626");
  }finally{
    busy = false;
  }
}

function updatePunchButton(){
  const button = document.getElementById("punchButton");
  const state = document.getElementById("attendanceState");

  if(currentEmployee.currentlyPunchedIn){
    button.textContent = "Punch OUT";
    button.className = "red";
    state.textContent = "Punched IN";
  }else{
    button.textContent = "Punch IN";
    button.className = "green";
    state.textContent = "Not Punched IN";
  }
}

async function getGPS(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("GPS इस फोन में उपलब्ध नहीं है"));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position=>{
        resolve({
          latitude:position.coords.latitude,
          longitude:position.coords.longitude,
          accuracy:position.coords.accuracy
        });
      },
      error=>{
        reject(new Error(
          "GPS location नहीं मिली। Location permission चालू करें।"
        ));
      },
      {
        enableHighAccuracy:true,
        timeout:20000,
        maximumAge:0
      }
    );
  });
}

async function punchAttendance(){
  if(busy) return;

  if(!currentEmployee || !currentDescriptor){
    message("पहले Face पहचानें","#dc2626");
    return;
  }

  busy = true;

  const button = document.getElementById("punchButton");
  button.disabled = true;

  try{
    const action =
      currentEmployee.currentlyPunchedIn ? "OUT" : "IN";

    message("GPS location जाँची जा रही है...");

    const gps = await getGPS();

    if(gps.accuracy > 100){
      throw new Error(
        "GPS accuracy कम है। खुले स्थान पर जाकर दोबारा कोशिश करें।"
      );
    }

    const user = await ensureLogin();
    const token = await user.getIdToken(true);

    message("Attendance save हो रही है...");

    const response = await fetch(
      WORKER_URL+"/face-punch",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
          action,
          descriptor:currentDescriptor,
          latitude:gps.latitude,
          longitude:gps.longitude
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.message || "Attendance save नहीं हुई");
    }

    currentEmployee.currentlyPunchedIn = action === "IN";

    updatePunchButton();

    const summary = data.summary || {};

    let resultText =
      `सफलता! Punch ${action} दर्ज हो गया। `+
      `समय: ${data.time}`;

    if(action === "OUT"){
      resultText +=
        ` | Work Hours: ${summary.completedWorkHours ?? 0}`+
        ` | OT Hours: ${summary.overtimeHours ?? 0}`;
    }

    message(resultText,"#15803d");

  }catch(error){
    message(error.message,"#dc2626");
  }finally{
    busy = false;
    button.disabled = false;
  }
}

function resetScan(){
  currentEmployee = null;
  currentDescriptor = null;

  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
    cameraStream = null;
  }

  camera.srcObject = null;

  hide("camera");
  hide("identifyButton");
  hide("employeeBox");
  hide("punchButton");
  hide("rescanButton");

  show("scanButton");

  message("दोबारा Face Scan करने के लिए Start Face Scan दबाएं।");
}

window.addEventListener("beforeunload",()=>{
  if(cameraStream){
    cameraStream.getTracks().forEach(track=>track.stop());
  }
});
</script>

</body>
</html>
