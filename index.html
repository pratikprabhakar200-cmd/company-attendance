
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Attendance - Admin</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f1f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px 24px;
  border-radius: 18px;
  box-shadow: 0 8px 30px #00000012;
}

h2 {
  text-align: center;
  color: #172554;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #334155;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

#dashboard {
  display: none;
}

.welcome {
  background: #eff6ff;
  padding: 18px;
  border-radius: 12px;
  margin-top: 20px;
  color: #1e3a8a;
  text-align: center;
}

.feature {
  padding: 15px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  margin-top: 12px;
  color: #334155;
}

.logout {
  background: #dc2626;
}

.logout:hover {
  background: #b91c1c;
}

#message {
  text-align: center;
  color: #dc2626;
  font-size: 13px;
  margin-top: 15px;
  min-height: 18px;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #94a3b8;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div id="login">
    <h2>COMPANY ATTENDANCE</h2>
    <p class="subtitle">ADMINISTRATOR LOGIN</p>

    <form id="loginForm">
      <label>Admin Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit" id="loginBtn">
        LOGIN
      </button>
    </form>

    <div id="message"></div>
  </div>

  <div id="dashboard">
    <h2>ADMIN DASHBOARD</h2>
    <p class="subtitle">COMPANY ATTENDANCE SYSTEM</p>

    <div class="welcome">
      <h3>Welcome, Admin!</h3>
      <p id="adminEmail"></p>
    </div>

    <div class="feature">
      <b>Employee Registration</b>
      <p>Coming in the next step</p>
    </div>

    <div class="feature">
      <b>Face Registration</b>
      <p>Coming in the next step</p>
    </div>

    <div class="feature">
      <b>Attendance & OT Reports</b>
      <p>Coming in the next step</p>
    </div>

    <button class="logout" id="logoutBtn">
      LOGOUT
    </button>
  </div>

  <div class="footer">
    SMART EMPLOYEE ATTENDANCE SYSTEM
  </div>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Firebase Console se apna Web App Config yahan paste karein.
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "company-attendance-8bbb1.firebaseapp.com",
  databaseURL: "https://company-attendance-8bbb1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "company-attendance-8bbb1",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

document.getElementById("loginForm").addEventListener(
  "submit",
  async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const loginBtn = document.getElementById("loginBtn");

    message.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "PLEASE WAIT...";

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      message.textContent = "Login failed: " + error.message;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "LOGIN";
    }
  }
);

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginBox.style.display = "none";
    dashboard.style.display = "block";
    document.getElementById("adminEmail").textContent = user.email;
  } else {
    loginBox.style.display = "block";
    dashboard.style.display = "none";
  }
});

document.getElementById("logoutBtn").addEventListener(
  "click",
  async () => {
    await signOut(auth);
  }
);
</script>

</body>
</html>
